<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkBuddy Skills - Skill 安装包索引</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 2rem; }
    h1 { color: #58a6ff; font-size: 1.8rem; margin-bottom: 0.3rem; }
    .subtitle { color: #8b949e; font-size: 0.95rem; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.2rem; transition: border-color 0.2s; }
    .card:hover { border-color: #58a6ff; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .skill-name { font-weight: 600; color: #e6edf3; font-size: 1.05rem; }
    .version { background: #1f6feb; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; }
    .description { color: #8b949e; font-size: 0.88rem; margin-bottom: 0.8rem; line-height: 1.5; }
    .meta { font-size: 0.8rem; color: #8b949e; margin-bottom: 0.8rem; }
    .meta span { margin-right: 1rem; }
    .tags { margin-bottom: 0.8rem; }
    .tag { display: inline-block; background: #21262d; color: #8b949e; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; margin-right: 4px; margin-bottom: 4px; }
    .download-btn { display: inline-block; background: #238636; color: #fff; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 0.88rem; transition: background 0.2s; }
    .download-btn:hover { background: #2ea043; }
    .install-cmd { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; font-family: monospace; font-size: 0.78rem; color: #7ee787; margin-top: 0.6rem; word-break: break-all; }
    .footer { margin-top: 3rem; color: #8b949e; font-size: 0.82rem; text-align: center; }
  </style>
</head>
<body>
  <h1>🛠️ WorkBuddy Skills</h1>
  <p class="subtitle">Skill 安装包索引 · 双击 ZIP 安装或复制安装命令</p>
  <div class="grid" id="grid"></div>
  <p class="footer">由 git-sync 自动生成 · 最后更新: <span id="ts"></span></p>
  <script>
    const SKILLS = [
      {
        "name": "semantic-split",
        "version": "2.4.1",
        "description": "语义拆分与智能规划技能。将自然语言拆分为结构化需求块，基于5W2H维度提取与约束标注增强语义理解，双视角推理整合为单一执行步骤，支持自增强json沉淀机制。",
        "author": "wUwproject",
        "tags": ["语义拆分","任务规划","json沉淀","渐进加载","5W2H","约束标注"],
        "zip": "semantic-split_v2.4.1.zip"
      }
    ];
    const grid = document.getElementById('grid');
    SKILLS.forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="skill-name">${s.name}</span>
          <span class="version">v${s.version}</span>
        </div>
        <div class="description">${s.description}</div>
        <div class="meta">
          <span>👤 ${s.author}</span>
          <span>📦 ${s.zip}</span>
        </div>
        <div class="tags">${s.tags.map(t => '<span class="tag">' + t + '</span>').join('')}</div>
        <a class="download-btn" href="${s.zip}" download>⬇ 下载 ZIP</a>
        <div class="install-cmd">/skill-install ${s.zip}</div>`;
      grid.appendChild(card);
    });
    document.getElementById('ts').textContent = new Date().toLocaleString('zh-CN');
  </script>
</body>
</html>
