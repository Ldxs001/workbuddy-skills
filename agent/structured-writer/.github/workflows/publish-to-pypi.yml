name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/structured-writer-ldxs/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine
      - name: Auto-detect and set dev status from version
        working-directory: agent/structured-writer
        run: |
          python -c "
import re
version = open('structured_writer/__init__.py').read()
m = re.search(r'__version__\s*=\s*\"([^\"]+)\"', version)
v = m.group(1) if m else '1.0.0'
print(f'Detected version: {v}')
is_prerelease = bool(re.search(r'\.(a|alpha|b|beta|rc|dev)\d+', v, re.I))
dev_status = '4 - Beta' if is_prerelease else '5 - Production/Stable'
print(f'Development Status :: {dev_status}')
content = open('pyproject.toml').read()
content = re.sub(
    r'\"Development Status :: .*\"',
    f'\"Development Status :: {dev_status}\"',
    content
)
open('pyproject.toml', 'w').write(content)
"
      - name: Build package
        working-directory: agent/structured-writer
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agent/structured-writer/dist/
