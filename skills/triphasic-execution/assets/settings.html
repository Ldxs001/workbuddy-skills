<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triphasic Execution - 设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #4ecdc4;
            margin-bottom: 10px;
            font-size: 28px;
            border-bottom: 2px solid #4ecdc4;
            padding-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 14px;
        }

        fieldset {
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #1a1a2e;
        }

        legend {
            color: #4ecdc4;
            font-weight: bold;
            font-size: 16px;
            padding: 0 10px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 15px;
            background: #0f3460;
            border-radius: 6px;
            flex: 1;
            transition: all 0.3s;
        }

        .radio-label:hover {
            background: #1a3a6e;
        }

        .radio-label input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
        }

        .radio-label:has(input:checked) {
            background: #4ecdc4;
            color: #1a1a2e;
        }

        .path-group {
            margin-top: 15px;
        }

        .path-item {
            margin-bottom: 12px;
        }

        .path-item label {
            display: block;
            color: #a0a0a0;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .path-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .path-input-wrapper input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1a3a6e;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .path-input-wrapper input[type="text"]:focus {
            outline: none;
            border-color: #4ecdc4;
        }

        .btn-browse {
            padding: 8px 16px;
            background: #0f3460;
            border: 1px solid #1a3a6e;
            border-radius: 6px;
            color: #4ecdc4;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-browse:hover {
            background: #1a3a6e;
            border-color: #4ecdc4;
        }

        .btn-browse:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .note {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .message.success {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid #4ecdc4;
            color: #4ecdc4;
            display: block;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #4ecdc4;
        }

        .loading:after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Triphasic Execution 设置</h1>
        <p class="subtitle">配置调用方式、记录文件路径和任务确认行为</p>

        <form id="settings-form">
            <fieldset>
                <legend>🔧 默认调用方式</legend>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="mode" value="on_demand" checked>
                        <span>🟢 调用模式（按需）</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="mode" value="global">
                        <span>🔵 全局模式</span>
                    </label>
                </div>
                <p class="note">💡 调用模式：仅当主动加载技能时应用三步框架。全局模式：所有任务自动应用三步框架（需启动 daemon）。</p>
            </fieldset>

            <fieldset>
                <legend>📂 记录文件路径</legend>
                <div class="path-group">
                    <div class="path-item">
                        <label>TRIPHASIC_HOME（数据目录）</label>
                        <div class="path-input-wrapper">
                            <input type="text" name="triphasic_home" id="triphasic_home" placeholder="~/.workbuddy/triphasic/">
                            <button type="button" class="btn-browse" onclick="browsePath('triphasic_home')" disabled>选择</button>
                        </div>
                    </div>
                    <div class="path-item">
                        <label>Problems 文件</label>
                        <div class="path-input-wrapper">
                            <input type="text" name="problems_file" id="problems_file" placeholder="PROBLEMS.md">
                            <button type="button" class="btn-browse" onclick="browsePath('problems_file')" disabled>选择</button>
                        </div>
                    </div>
                    <div class="path-item">
                        <label>Risks 文件</label>
                        <div class="path-input-wrapper">
                            <input type="text" name="risks_file" id="risks_file" placeholder="RISKS.md">
                            <button type="button" class="btn-browse" onclick="browsePath('risks_file')" disabled>选择</button>
                        </div>
                    </div>
                    <div class="path-item">
                        <label>Lessons 文件</label>
                        <div class="path-input-wrapper">
                            <input type="text" name="lessons_file" id="lessons_file" placeholder="LESSONS_REGISTER.md">
                            <button type="button" class="btn-browse" onclick="browsePath('lessons_file')" disabled>选择</button>
                        </div>
                    </div>
                    <div class="path-item">
                        <label>Logs 目录</label>
                        <div class="path-input-wrapper">
                            <input type="text" name="logs_dir" id="logs_dir" placeholder=".problem_logs">
                            <button type="button" class="btn-browse" onclick="browsePath('logs_dir')" disabled>选择</button>
                        </div>
                    </div>
                </div>
                <p class="note">💡 未自定义时使用 TRIPHASIC_HOME 的默认路径。由于浏览器安全限制，"选择"按钮已禁用，请手动输入路径。</p>
            </fieldset>

            <fieldset>
                <legend>✅ 任务规划确认</legend>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="require_confirmation" value="true" checked>
                        <span>🟢 询问确认后再执行</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="require_confirmation" value="false">
                        <span>🔵 直接按照规划执行</span>
                    </label>
                </div>
                <p class="note">💡 选择"询问确认"后，Agent 在执行任务规划前会先请求用户确认。</p>
            </fieldset>

            <button type="submit" class="btn-submit" id="btn-submit">确定</button>
        </form>

        <div class="loading" id="loading">正在保存设置</div>
        <div class="message" id="message"></div>
    </div>

    <script>
        // 页面加载时获取当前配置
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/config');
                if (!response.ok) {
                    throw new Error('Failed to load config');
                }
                const config = await response.json();
                populateForm(config);
            } catch (error) {
                console.error('Error loading config:', error);
                showMessage('加载当前配置失败，将使用默认值。', 'error');
            }
        });

        // 填充表单
        function populateForm(config) {
            // 调用方式
            const mode = config.mode || 'on_demand';
            document.querySelector(`input[name="mode"][value="${mode}"]`).checked = true;

            // 记录文件路径
            document.getElementById('triphasic_home').value = config._triphasic_home || '~/.workbuddy/triphasic/';
            document.getElementById('problems_file').value = config.problems_file || 'PROBLEMS.md';
            document.getElementById('risks_file').value = config.risks_file || 'RISKS.md';
            document.getElementById('lessons_file').value = config.lessons_file || 'LESSONS_REGISTER.md';
            document.getElementById('logs_dir').value = config.logs_dir || '.problem_logs';

            // 任务规划确认
            const requireConfirmation = config.hooks && config.hooks.require_task_confirmation !== false;
            document.querySelector(`input[name="require_confirmation"][value="${requireConfirmation}"]`).checked = true;
        }

        // 浏览路径（由于浏览器安全限制，此功能已禁用）
        function browsePath(inputId) {
            // 浏览器不支持直接访问文件系统，此功能需要后端支持
            alert('由于浏览器安全限制，无法打开文件路径选择器。请手动输入路径。');
        }

        // 表单提交
        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnSubmit = document.getElementById('btn-submit');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');

            // 禁用按钮，显示加载
            btnSubmit.disabled = true;
            loading.style.display = 'block';
            message.style.display = 'none';

            // 收集表单数据
            const formData = {
                mode: document.querySelector('input[name="mode"]:checked').value,
                triphasic_home: document.getElementById('triphasic_home').value,
                problems_file: document.getElementById('problems_file').value,
                risks_file: document.getElementById('risks_file').value,
                lessons_file: document.getElementById('lessons_file').value,
                logs_dir: document.getElementById('logs_dir').value,
                require_confirmation: document.querySelector('input[name="require_confirmation"]:checked').value === 'true'
            };

            try {
                const response = await fetch('/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✅ 设置已保存！可关闭此页面。', 'success');
                    // 3秒后自动关闭（可选）
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                } else {
                    throw new Error(result.error || 'Unknown error');
                }
            } catch (error) {
                console.error('Error saving settings:', error);
                showMessage('❌ 保存失败：' + error.message, 'error');
                btnSubmit.disabled = false;
            } finally {
                loading.style.display = 'none';
            }
        });

        // 显示消息
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
