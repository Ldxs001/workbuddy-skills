# =============================================================================
# PyPI Trusted Publisher — 全自动发布工作流
# 触发方式: git tag pypi/<type>/<name>/v<version> && git push --tags
#   例: git tag pypi/agents/rag-assistant/v0.8.3 && git push --tags
#   例: git tag pypi/skills/git-sync/v2.27.1 && git push --tags
# =============================================================================
name: Publish to PyPI (Trusted Publisher)

on:
  push:
    tags:
      - 'pypi/**/v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag and extract package info
        id: info
        run: |
          # Use GITHUB_REF instead of GITHUB_REF_NAME for reliability
          REF="$GITHUB_REF"
          # Remove refs/tags/ prefix
          TAG="${REF#refs/tags/}"
          # Remove pypi/ prefix
          REST="${TAG#pypi/}"

          # Extract version: everything after the last /
          VERSION="${REST##*/}"
          VERSION="${VERSION#v}"

          # Extract type+name: remove /v* suffix
          TYPES_AND_NAMES="${REST%/v*}"
          # TYPE is the first segment
          TYPE="${TYPES_AND_NAMES%%/*}"
          # NAME is everything after TYPE
          NAME="${TYPES_AND_NAMES#*/}"

          echo "REF=$REF"
          echo "TAG=$TAG"
          echo "REST=$REST"
          echo "VERSION=$VERSION"
          echo "TYPE=$TYPE"
          echo "NAME=$NAME"

          # Validate
          if [ -z "$TYPE" ] || [ -z "$NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::Invalid tag format. Expected: pypi/<type>/<name>/v<version>"
            exit 1
          fi
          if [ "$TYPE" != "skills" ] && [ "$TYPE" != "agents" ]; then
            echo "::error::Invalid type '$TYPE'. Must be 'skills' or 'agents'"
            exit 1
          fi

          DIR="${TYPE}/${NAME}"
          if [ ! -d "$DIR" ]; then
            echo "::error::Directory '$DIR' does not exist at $(pwd)"
            ls -la
            exit 1
          fi

          PYPI_NAME="${NAME}-ldxs"
          echo "PYPI_NAME=$PYPI_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install --upgrade pip build

      - name: Build wheel
        run: |
          REF="$GITHUB_REF"
          TAG="${REF#refs/tags/}"
          REST="${TAG#pypi/}"
          VERSION="${REST##*/}"
          VERSION="${VERSION#v}"
          TYPES_AND_NAMES="${REST%/v*}"
          TYPE="${TYPES_AND_NAMES%%/*}"
          NAME="${TYPES_AND_NAMES#*/}"
          PYPI_NAME="${NAME}-ldxs"

          python .github/scripts/pypi-build.py \
            "$TYPE" "$NAME" "$VERSION" "$PYPI_NAME"

      - name: Upload to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
