# =============================================================================
# PyPI Trusted Publisher — 全自动发布工作流
# 触发方式: git push --tags (匹配 v* 自动识别项目)
#   例: git tag v0.8.5 && git push --tags            → agent rag-assistant
#   例: git tag git-sync-v2.28.0 && git push --tags  → skill git-sync
# =============================================================================
name: Publish to PyPI (Trusted Publisher)

on:
  push:
    tags:
      - 'v*'
      - '*-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect project from tag
        id: info
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=""
          TYPE=""
          NAME=""

          # 格式1: v0.8.5 → agent, 在 agents/ 目录中查找匹配版本的项目
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION="${TAG#v}"
            TYPE="agents"
            # 扫描 agents/ 目录，找版本号匹配的项目
            for dir in agents/*/; do
              init_file="${dir}rag_assistant/__init__.py"
              if [ -f "$init_file" ]; then
                ver=$(grep '__version__' "$init_file" | sed 's/.*"\(.*\)".*/\1/')
                if [ "$ver" = "$VERSION" ]; then
                  NAME=$(basename "$dir")
                  echo "Found agent: $NAME v$VERSION"
                  break
                fi
              fi
            done
          else
            # 格式2: skill-name-v1.2.3 → skill
            VERSION=$(echo "$TAG" | sed 's/.*-v\([0-9.]*\)$/\1/')
            NAME=$(echo "$TAG" | sed 's/-v[0-9.]*$//')
            TYPE="skills"
          fi

          echo "VERSION=$VERSION TYPE=$TYPE NAME=$NAME"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "pypi_name=${NAME}-ldxs" >> $GITHUB_OUTPUT

          if [ -z "$NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::无法从 tag $TAG 识别项目"
            exit 1
          fi
          if [ ! -d "$TYPE/$NAME" ]; then
            echo "::error::目录 $TYPE/$NAME 不存在"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install --upgrade pip build

      - name: Build wheel
        run: |
          python .github/scripts/pypi-build.py \
            "${{ steps.info.outputs.type }}" \
            "${{ steps.info.outputs.name }}" \
            "${{ steps.info.outputs.version }}" \
            "${{ steps.info.outputs.pypi_name }}"

      - name: Upload to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true