# =============================================================================
# PyPI Trusted Publisher — 全自动发布工作流
# 触发方式: git tag pypi/<type>/<name>/v<version> && git push --tags
#   例: git tag pypi/agents/rag-assistant/v0.8.3 && git push --tags
#   例: git tag pypi/skills/git-sync/v2.27.1 && git push --tags
# =============================================================================
name: Publish to PyPI (Trusted Publisher)

on:
  push:
    tags:
      - 'pypi/**/v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag and extract package info
        id: info
        run: |
          echo "=== ENV DUMP ==="
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_REF_TYPE=$GITHUB_REF_TYPE"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "=== CHECKOUT ==="
          pwd
          ls -la
          echo "=== DIRECTORY CHECK ==="
          test -d agents && echo "agents/ exists" || echo "agents/ MISSING"
          test -d skills && echo "skills/ exists" || echo "skills/ MISSING"

          # Parse tag
          REF="$GITHUB_REF"
          TAG="${REF#refs/tags/}"
          echo "REF=$REF TAG=$TAG"
          REST="${TAG#pypi/}"
          VERSION="${REST##*/}"
          VERSION="${VERSION#v}"
          TYPES_AND_NAMES="${REST%/v*}"
          TYPE="${TYPES_AND_NAMES%%/*}"
          NAME="${TYPES_AND_NAMES#*/}"

          echo "VERSION=$VERSION TYPE=$TYPE NAME=$NAME"
          exit 0  # stop here for debugging

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install --upgrade pip build

      - name: Build wheel
        run: |
          REF="$GITHUB_REF"
          TAG="${REF#refs/tags/}"
          REST="${TAG#pypi/}"
          VERSION="${REST##*/}"
          VERSION="${VERSION#v}"
          TYPES_AND_NAMES="${REST%/v*}"
          TYPE="${TYPES_AND_NAMES%%/*}"
          NAME="${TYPES_AND_NAMES#*/}"
          PYPI_NAME="${NAME}-ldxs"

          python .github/scripts/pypi-build.py \
            "$TYPE" "$NAME" "$VERSION" "$PYPI_NAME"

      - name: Upload to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
